apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-token
  namespace: flux-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: github-webhook-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: github/webhook_token
