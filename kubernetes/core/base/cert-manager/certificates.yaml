apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-bootstrap
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cnpg-apps-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: cnpg-apps-ca
  secretName: cnpg-apps-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cnpg-apps-ca-issuer
spec:
  ca:
    secretName: cnpg-apps-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: data-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: data-ca
  secretName: data-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: data-ca-issuer
spec:
  ca:
    secretName: data-ca
