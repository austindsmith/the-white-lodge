apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kube-prometheus-stack-grafana
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`monitoring.${cluster_domain}`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
