apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: media
  name: mealie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.20.1
          env:
            - name: ALLOW_SIGNUP
              value: "true"
            - name: PGID
              value: "100"
            - name: PUID
              value: "1037"
            - name: TZ
              value: ${timezone}
            - name: BASE_URL
              value: https://mealie.${cluster_domain}
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_SERVER
              value: ${apps_pg_host}
            - name: POSTGRES_PORT
              value: "5432"
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_SIGNUP_ENABLED
              value: "true"
            - name: OIDC_PROVIDER_NAME
              value: "Authentik"
            - name: OIDC_REMEMBER_ME
              value: "true"
            - name: OIDC_USER_CLAIM
              value: preferred_username
            - name: OIDC_NAME_CLAIM
              value: preferred_username
          envFrom:
            - secretRef:
                name: mealie
          ports:
            - containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - mountPath: /app/data
              name: mealie-data
      restartPolicy: Always
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-data
