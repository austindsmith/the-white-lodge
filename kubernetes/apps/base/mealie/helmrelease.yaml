apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
spec:
  chartRef:
    kind: OCIRepository
    name: bjw-s-labs
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      mealie:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.20.1
            envFrom:
              - secretRef:
                  name: mealie
            env:
              ALLOW_SIGNUP: "true"
              TZ: ${timezone}
              BASE_URL: https://mealie.${cluster_domain}
              DB_ENGINE: postgres
              POSTGRES_SERVER: ${apps_pg_host}
              POSTGRES_PORT: "5432"
              OIDC_AUTH_ENABLED: "true"
              OIDC_SIGNUP_ENABLED: "true"
              OIDC_PROVIDER_NAME: Authentik
              OIDC_REMEMBER_ME: "true"
              OIDC_USER_CLAIM: preferred_username
              OIDC_NAME_CLAIM: preferred_username
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: 9000
    ingress:
      app:
        className: traefik
        hosts:
          - host: mealie.${cluster_domain}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      data:
        existingClaim: mealie-data
        globalMounts:
          - path: /app/data
