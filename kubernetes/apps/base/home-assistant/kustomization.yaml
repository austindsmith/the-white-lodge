apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant

resources:
  - helm-release.yaml
  - helm-repository.yaml
  - namespace.yaml
  - pvc-config.yaml
  - ingress-route.yaml

configMapGenerator:
  - name: home-assistant-themes
    files:
      - themes/black-lodge.yaml
  - name: home-assistant-dashboards
    files:
      - dashboards/ui-lovelace.yaml
      - dashboards/media.yaml

generatorOptions:
  disableNameSuffixHash: true
