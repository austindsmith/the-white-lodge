apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: media
  name: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy
          env:
            NTFY_BASE_URL: http://ntfy.${cluster_domain}
            NTFY_ATTACHMENT_CACHE_DIR: "/var/cache/ntfy/attachments"
            NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
            NTFY_AUTH_ACCESS: "*:up*:write-only"
            NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
            NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
            NTFY_BEHIND_PROXY: true
            NTFY_ENABLE_LOGIN: true
            NTFY_ENABLE_SIGNUP: true
          envFrom:
            - secretRef:
                name: ntfy
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/lib/ntfy
              name: ntfy-data
            - mountPath: /var/cache/ntfy/attachments
              name: ntfy-attachments
      restartPolicy: Always
      volumes:
        - name: ntfy-data
          persistentVolumeClaim:
            claimName: ntfy-data
        - name: ntfy-attachments
          persistentVolumeClaim:
            claimName: ntfy-attachments
