apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firefox
  template:
    metadata:
      labels:
        app: firefox
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: firefox
          image: lscr.io/linuxserver/firefox:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Denver
            - name: TITLE
              value: Special Education Data
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
            - name: custom-init
              mountPath: /custom-cont-init.d
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: filebrowser
          image: filebrowser/filebrowser:latest
          args:
            - --noauth
            - --address=0.0.0.0
            - --port=8080
            - --root=/srv
            - --database=/db/filebrowser.db
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /srv
              subPath: Downloads
            - name: config
              mountPath: /db
              subPath: filebrowser
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: firefox-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: custom-init
          configMap:
            name: firefox-custom-init
            defaultMode: 0755
