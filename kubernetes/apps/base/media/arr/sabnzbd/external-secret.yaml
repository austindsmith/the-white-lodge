---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-config-files
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: op-secret-store
    kind: ClusterSecretStore
  target:
    name: sabnzbd-config-files
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: sabnzbd-config-files
            items:
              - key: sabnzbd.ini
  dataFrom:
    - extract:
        key: sabnzbd
