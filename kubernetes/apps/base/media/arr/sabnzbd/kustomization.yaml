apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media

resources:
  - pvc-config.yaml
  - ingress-route.yaml
  - deployment.yaml
  - service.yaml
  - external-secret.yaml

configMapGenerator:
  - name: sabnzbd-config-files
    files:
      - configs/sabnzbd.ini
    options:
      disableNameSuffixHash: true
