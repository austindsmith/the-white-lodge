apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-settings
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: bazarr-settings
    creationPolicy: Owner
  data:
    - secretKey: config.yaml
      remoteRef:
        key: bazarr/config.yaml
