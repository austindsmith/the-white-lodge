apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: media
  name: fileflows
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fileflows
  template:
    metadata:
      labels:
        app: fileflows
    spec:
      containers:
        - env:
            - name: BROWSER_START_DIR
              value: /apps/media
            - name: PGID
              value: "100"
            - name: PUID
              value: "1037"
            - name: TZ
              value: America/Denver
            - name: TempPathHost
              value: /app/temp
          image: revenz/fileflows
          name: fileflows
          ports:
            - containerPort: 5000
              protocol: TCP
          volumeMounts:
            - mountPath: /app/media
              name: fileflows-media
            - mountPath: /temp
              name: fileflows-temp
            - mountPath: /app/Data
              name: fileflows-data
            - mountPath: /app/Logs
              name: fileflows-logs
            - mountPath: /app/common
              name: fileflows-common
      restartPolicy: Always
      volumes:
        - name: fileflows-media
          existingClaim: media
          globalMounts:
            - path: /media
        - name: fileflows-common
          persistentVolumeClaim:
            claimName: fileflows-common
        - name: fileflows-data
          persistentVolumeClaim:
            claimName: fileflows-data
        - name: fileflows-logs
          persistentVolumeClaim:
            claimName: fileflows-logs
        - name: fileflows-temp
          persistentVolumeClaim:
            claimName: fileflows-temp
