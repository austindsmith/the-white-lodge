apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: media
  name: fileflows
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fileflows
  template:
    metadata:
      labels:
        app: fileflows
    spec:
      hostname: fileflows
      containers:
        - name: fileflows
          image: revenz/fileflows
          env:
            - name: FF_NO_ENCRYPT
              value: "1"
            - name: BROWSER_START_DIR
              value: /apps/media
            - name: PGID
              value: "100"
            - name: PUID
              value: "1037"
            - name: TZ
              value: America/Denver
          ports:
            - containerPort: 5000
              protocol: TCP
          resources:
            requests:
              cpu: 1000m
              memory: 8Gi
            limits:
              cpu: "3"
              memory: 12Gi
          startupProbe:
            httpGet:
              path: /
              port: 5000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - mountPath: /media
              name: fileflows-media
            - mountPath: /temp
              name: fileflows-temp
            - mountPath: /app/Data
              name: fileflows-data
            - mountPath: /app/Logs
              name: fileflows-logs
            - mountPath: /app/common
              name: fileflows-common
      restartPolicy: Always
      volumes:
        - name: fileflows-media
          persistentVolumeClaim:
            claimName: media
        - name: fileflows-common
          persistentVolumeClaim:
            claimName: fileflows-common
        - name: fileflows-data
          persistentVolumeClaim:
            claimName: fileflows-data
        - name: fileflows-logs
          persistentVolumeClaim:
            claimName: fileflows-logs
        - name: fileflows-temp
          emptyDir:
            sizeLimit: 50Gi
