apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media

resources:
  - helm-release.yaml
  - helm-repository.yaml
  - ingress-route.yaml
  - pvc-config.yaml
  - external-secret.yaml


configMapGenerator:
  - name: qbittorrent-config-files
    files:
      - configs/categories.json
      - configs/qBittorrent.conf
    options:
      disableNameSuffixHash: true
