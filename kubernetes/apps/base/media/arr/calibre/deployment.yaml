apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre
  template:
    metadata:
      labels:
        app: calibre
    spec:
      securityContext:
        runAsUser: ${media_puid}
        runAsGroup: ${media_pgid}
        fsGroup: ${media_pgid}
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: calibre
          image: lscr.io/linuxserver/calibre:latest
          env:
            - name: PUID
              value: "1037"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
            - name: TZ
              value: America/Denver
          ports:
            - name: http
              containerPort: 8181
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: calibre-config
        - name: media
          persistentVolumeClaim:
            claimName: media
