apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik

resources:
  - namespace.yaml
  - helm-release.yaml
  - helm-repository.yaml
  - ingress-route.yaml
  - secret.yaml
  - blueprints/secret.yaml

configMapGenerator:
  - name: authentik-custom-blueprints
    files:
      - blueprints/theblacklodge.yaml
    options:
      disableNameSuffixHash: true
