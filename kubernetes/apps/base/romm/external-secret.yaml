apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-external-secret
  namespace: romm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: romm
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: romm
  refreshInterval: 6h
