apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bytebase
spec:
  install:
    createNamespace: true
  interval: 1h
  chart:
    spec:
      chart: bytebase
      version: 1.1.3
      sourceRef:
        kind: HelmRepository
        name: bytebase
  valuesFrom:
    - kind: Secret
      name: data-db-secret
      valuesKey: password
      targetPath: bytebase.option.externalPg.pgPassword
    - kind: Secret
      name: data-db-secret
      valuesKey: username
      targetPath: bytebase.option.externalPg.pgUsername
  values:
    bytebase:
      option:
        external-url: "https://bytebase.${cluster_domain}"
        externalPg: # Bytebase will ignore the bytebase.option.externalPg.url if this is specified.
          pgHost: "data-cluster-rw.data.svc.cluster.local"
          pgPort: "5432"
          pgDatabase: "scratch"
