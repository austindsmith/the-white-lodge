apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin4
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin4
  template:
    metadata:
      labels:
        app: pgadmin4
    spec:
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-certs
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              for cluster in apps-cluster data-cluster; do
                mkdir -p /certs/$cluster
                cp /in-$cluster/tls.crt /certs/$cluster/postgresql.crt
                cp /in-$cluster/tls.key /certs/$cluster/postgresql.key
                cp /in-$cluster/ca.crt /certs/$cluster/root.crt
              done
              mkdir -p /home-postgresql
              cp /in-apps-cluster/ca.crt /home-postgresql/root.crt
              chmod -R 0600 /certs/*/postgresql.key
              chmod -R 0644 /certs/*/postgresql.crt /certs/*/root.crt
              chmod 0644 /home-postgresql/root.crt
          volumeMounts:
            - name: apps-cluster-tls
              mountPath: /in-apps-cluster
              readOnly: true
            - name: data-cluster-tls
              mountPath: /in-data-cluster
              readOnly: true
            - name: certs
              mountPath: /certs
            - name: home-postgresql
              mountPath: /home-postgresql
      containers:
        - name: pgadmin4
          image: dpage/pgadmin4:9.8
          volumeMounts:
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: certs
              mountPath: /home/pgadmin/.postgresql-certs
              readOnly: true
            - name: home-postgresql
              mountPath: /home/pgadmin/.postgresql
            - name: data
              mountPath: /var/lib/pgadmin
      volumes:
        - name: home-postgresql
          emptyDir: {}
