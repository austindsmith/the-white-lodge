apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin4
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin4
  template:
    metadata:
      labels:
        app: pgadmin4
    spec:
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-certs
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              for cluster in apps-cluster data-cluster; do
                mkdir -p /certs/$cluster
                cp /in-$cluster/tls.crt /certs/$cluster/postgresql.crt
                cp /in-$cluster/tls.key /certs/$cluster/postgresql.key
                cp /in-$cluster/ca.crt /certs/$cluster/root.crt
              done
              chmod -R 0600 /certs/*/postgresql.key
              chmod -R 0644 /certs/*/postgresql.crt /certs/*/root.crt
          volumeMounts:
            - name: apps-cluster-tls
              mountPath: /in-apps-cluster
              readOnly: true
            - name: data-cluster-tls
              mountPath: /in-data-cluster
              readOnly: true
            - name: certs
              mountPath: /certs
      containers:
        - name: pgadmin4
          image: dpage/pgadmin4:9.8
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: pgadmin4
          volumeMounts:
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: certs
              mountPath: /home/pgadmin/.postgresql-certs
              readOnly: true
            - name: data
              mountPath: /var/lib/pgadmin
      volumes:
        - name: servers
          configMap:
            name: pgadmin4-servers
        - name: apps-cluster-tls
          secret:
            secretName: pgadmin4-apps-cluster-cert
        - name: data-cluster-tls
          secret:
            secretName: pgadmin4-data-cluster-cert
        - name: certs
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: pgadmin4-data
