apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin4
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin4
  template:
    metadata:
      labels:
        app: pgadmin4
    spec:
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-certs
          image: busybox:1.37
          command:
            - sh
            - -c
            - cp /in/tls.crt /in/tls.key /in/ca.crt /certs/ && chmod 0600 /certs/tls.key && chmod 0644 /certs/tls.crt /certs/ca.crt
          volumeMounts:
            - name: client-tls
              mountPath: /in
              readOnly: true
            - name: certs
              mountPath: /certs
      containers:
        - name: pgadmin4
          image: dpage/pgadmin4:9.8
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: pgadmin4
          volumeMounts:
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: data
              mountPath: /var/lib/pgadmin
      volumes:
        - name: servers
          configMap:
            name: pgadmin4-servers
        - name: client-tls
          secret:
            secretName: pgadmin4-client-tls
        - name: certs
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: pgadmin4-data
