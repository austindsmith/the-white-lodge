apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin4-servers
  namespace: data
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "apps-cluster",
          "Group": "CNPG",
          "Host": "apps-cluster-rw.cnpg-apps.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "postgres",
          "SSLMode": "verify-full",
          "SSLCert": "/certs/tls.crt",
          "SSLKey": "/certs/tls.key",
          "SSLRootCert": "/certs/ca.crt"
        }
      }
    }
