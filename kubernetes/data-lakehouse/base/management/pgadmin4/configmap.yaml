apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin4
  namespace: data
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "apps-cluster",
          "Group": "Servers",
          "Host": "apps-cluster-rw.cnpg-apps.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "postgres",
          "SSLMode": "verify-full",
          "SSLRootCert": "/certs/postgres/ca.crt",
          "SSLCert": "/certs/postgres/tls.crt",
          "SSLKey": "/certs/postgres/tls.key"
        },
        "2": {
          "Name": "data-cluster",
          "Group": "Servers",
          "Host": "data-cluster-rw.data.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "postgres",
          "PassFile": "file.pgpass",
          "SSLMode": "require",
          "SSLCert": "postgresql.crt",
          "SSLKey": "postgresql.key"
        }
      }
    }
