apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pgadmin4-client-cert
  namespace: data
spec:
  secretName: pgadmin4-client-tls
  duration: 2160h
  renewBefore: 360h
  commonName: postgres
  usages:
    - client auth
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: cnpg-apps-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
