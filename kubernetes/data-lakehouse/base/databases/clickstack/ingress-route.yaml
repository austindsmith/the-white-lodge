apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clickstack
  namespace: data
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`clickstack.thewhitelodge.org`)
      middlewares:
        - name: clickstack-https-proto
      services:
        - kind: Service
          name: clickstack-app
          port: 3000
