apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clickstack
  namespace: data
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`clickstack.${cluster_domain}`)
      middlewares:
        - name: clickstack-https-proto
      services:
        - kind: Service
          name: clickstack-app
          port: 3000
  tls:
    secretName: clickstack-tls
