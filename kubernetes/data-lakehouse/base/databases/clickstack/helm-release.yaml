apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickstack
  namespace: data
spec:
  interval: 1h
  releaseName: clickstack
  dependsOn:
    - name: clickstack-operators
  chart:
    spec:
      chart: clickstack
      version: 3.0.2
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: data
  valuesFrom:
    - kind: Secret
      name: clickstack-secrets
      valuesKey: values.yaml
  values:
    hyperdx:
      config:
        USAGE_STATS_ENABLED: "false"
        FRONTEND_URL: clickstack.${cluster_domain}
      ingress:
        enabled: false
      service:
        type: ClusterIP
    mongodb:
      enabled: true
      spec:
        members: 1
        type: ReplicaSet
        version: "5.0.32"
        security:
          authentication:
            modes: ["SCRAM"]
        users:
          - name: hyperdx
            db: hyperdx
            passwordSecretRef:
              name: '{{ include "clickstack.mongodb.fullname" . }}-password'
            roles:
              - name: dbOwner
                db: hyperdx
              - name: clusterMonitor
                db: admin
            scramCredentialsSecretName: '{{ include "clickstack.mongodb.fullname" . }}-scram'
        statefulSet:
          spec:
            template:
              spec:
                containers:
                  - name: mongod
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
            volumeClaimTemplates:
              - metadata:
                  name: data-volume
                spec:
                  accessModes: ["ReadWriteOnce"]
                  storageClassName: longhorn-single-replica
                  resources:
                    requests:
                      storage: 10Gi
              - metadata:
                  name: logs-volume
                spec:
                  accessModes: ["ReadWriteOnce"]
                  storageClassName: longhorn-single-replica
                  resources:
                    requests:
                      storage: 2Gi
    clickhouse:
      keeper:
        spec:
          containerTemplate:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
          dataVolumeClaimSpec:
            storageClassName: longhorn-single-replica
      cluster:
        spec:
          containerTemplate:
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
          dataVolumeClaimSpec:
            storageClassName: longhorn-single-replica
