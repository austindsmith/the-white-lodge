apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: data-cluster
  namespace: data
spec:
  instances: 3
  enableSuperuserAccess: true
  certificates:
    serverTLSSecret: data-cluster-server-cert
    serverCASecret: data-cluster-server-cert
    clientCASecret: data-cluster-client-cert
    replicationTLSSecret: data-cluster-client-cert
  postgresql:
    pg_hba:
      - hostssl all all 192.168.1.0/24 trust
      - hostssl all all 192.168.2.5/32 trust
      - hostssl all all 10.42.0.0/16 trust
      - hostssl all all all scram-sha-256
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "data-cluster-lb"
              annotations:
                metallb.io/loadBalancerIPs: 10.10.10.4
            spec:
              type: LoadBalancer
  bootstrap:
    initdb:
      database: app
      owner: data
      secret:
        name: data-db-secret
  storage:
    size: 15Gi
