apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metabase
spec:
  chartRef:
    kind: OCIRepository
    name: bjw-s-labs
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      metabase:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: metabase/metabase
              tag: v0.63.10
            envFrom:
              - secretRef:
                  name: metabase-secret
            env:
              MB_DB_TYPE: postgres
              MB_DB_HOST: ${apps_db_host}
              MB_DB_PORT: "5432"
              MB_DB_DBNAME: metabase
              MB_JETTY_PORT: &port 3000
              MB_PLUGINS_DIR: /plugins
              MB_SITE_URL: https://metabase.${cluster_domain}
              MB_CHECK_FOR_UPDATES: "false"
              JAVA_TIMEZONE: America/Denver
              JAVA_OPTS: -Xmx1536m
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    ingress:
      app:
        className: traefik
        hosts:
          - host: metabase.${cluster_domain}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      plugins:
        type: emptyDir
        globalMounts:
          - path: /plugins
      tmp:
        type: emptyDir
