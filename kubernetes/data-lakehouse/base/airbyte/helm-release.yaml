apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airbyte
  namespace: data
spec:
  install:
    createNamespace: true
  interval: 1h
  chart:
    spec:
      chart: airbyte
      version: 1.9.2
      sourceRef:
        kind: HelmRepository
        name: airbyte
  values:
    global:
      edition: community

      airbyteUrl: "https://airbyte.${cluster_domain}"
