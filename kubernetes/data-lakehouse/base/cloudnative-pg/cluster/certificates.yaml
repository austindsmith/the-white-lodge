apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: cnpg-data
spec:
  selfSigned: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: data-cluster-server-cert
  labels:
    cnpg.io/reload: ""
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: data-cluster-server-cert
spec:
  secretName: data-cluster-server-cert
  usages:
    - server auth
  dnsNames:
    - data-cluster-rw
    - data-cluster-ro
    - data-cluster-r
    - data-cluster-rw.cnpg-data.svc
    - data-cluster-ro.cnpg-data.svc
    - data-cluster-r.cnpg-data.svc
    - data-cluster-rw.cnpg-data.svc.cluster.local
    - data-cluster-ro.cnpg-data.svc.cluster.local
    - data-cluster-r.cnpg-data.svc.cluster.local
    - data-cluster-1.data-cluster.cnpg-data.svc.cluster.local
    - data-cluster-2.data-cluster.cnpg-data.svc.cluster.local
    - data-cluster-3.data-cluster.cnpg-data.svc.cluster.local
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: Secret
metadata:
  name: data-cluster-client-cert
  labels:
    cnpg.io/reload: ""
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: data-cluster-client-cert
spec:
  secretName: data-cluster-client-cert
  usages:
    - client auth
  commonName: streaming_replica
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
