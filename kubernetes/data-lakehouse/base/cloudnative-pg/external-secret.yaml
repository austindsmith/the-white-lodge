apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-data-external-secret
  namespace: data
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: data-db-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: data-lakehouse-cnpg
