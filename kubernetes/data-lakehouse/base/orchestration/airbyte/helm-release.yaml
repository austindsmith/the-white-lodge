apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airbyte
  namespace: data
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: airbyte
      version: 2.1.1
      sourceRef:
        kind: HelmRepository
        name: airbyte
  values:
    postgresql:
      enabled: false
    global:
      edition: community
      airbyteUrl: "https://airbyte.${cluster_domain}"
      workloads:
        namespace: data
      auth:
        security:
          cookieSecureSetting: true
          cookieSameSiteSetting: Lax
      database:
        type: external
        secretName: airbyte-db
        host: apps-cluster-rw.cnpg-apps.svc.cluster.local
        port: 5432
        name: airbyte
        userSecretKey: username
        passwordSecretKey: password
      storage:
        type: minio
    server:
      configDbMaxPoolSize: "10"
      resources:
        requests: {cpu: 250m, memory: 1Gi}
        limits: {memory: 2Gi}
    worker:
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {memory: 1Gi}
    workloadLauncher:
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {memory: 1Gi}
    temporal:
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {memory: 1Gi}
      extraEnv:
        - name: SKIP_DB_CREATE
          value: "true"
        - name: DBNAME
          value: temporal
        - name: VISIBILITY_DBNAME
          value: temporal_visibility
