apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airbyte
  namespace: data
spec:
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: airbyte
      version: 2.1.1
      sourceRef:
        kind: HelmRepository
        name: airbyte
  values:
    global:
      edition: community
      airbyteUrl: "https://airbyte.${cluster_domain}"
#      secretName: "airbyte-secret"
#      auth:
#      enabled: true
#      instanceAdmin:
#        emailSecretKey: "email"
#        passwordSecretKey: "password"
