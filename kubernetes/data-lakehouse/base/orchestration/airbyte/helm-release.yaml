apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airbyte
  namespace: data
spec:
  interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: airbyte
      version: 2.1.1 #2.0.19
      sourceRef:
        kind: HelmRepository
        name: airbyte
  values:
    postgresql:
      enabled: false
    global:
      edition: community
      airbyteUrl: "https://airbyte.${cluster_domain}"
      database:
        type: external
        secretName: airbyte-db
        host: apps-cluster-rw.cnpg-apps.svc.cluster.local
        port: 5432
        name: airbyte
        userSecretKey: username
        passwordSecretKey: password
