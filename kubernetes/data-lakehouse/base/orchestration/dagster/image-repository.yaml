apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: dagster-project
  namespace: flux-system
spec:
  image: ghcr.io/your-github-username/dagster-project
  interval: 5m
  secretRef:
    name: ghcr-pull-secret
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: dagster-project
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: dagster-project
  policy:
    semver:
      range: ">=0.1.0"
