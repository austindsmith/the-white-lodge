# Override CHANGEME-name / CHANGEME-port via patch.yaml. See ../README.md.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: CHANGEME-name
  namespace: data
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`CHANGEME-name.${cluster_domain}`)
      kind: Rule
      services:
        - name: CHANGEME-name
          port: CHANGEME-port
