apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport-operator
  namespace: flux-system
spec:
  interval: 1m
  path: ./kubernetes/infrastructure/base/teleport/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport-config
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: teleport-operator
  path: ./kubernetes/infrastructure/base/teleport/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
