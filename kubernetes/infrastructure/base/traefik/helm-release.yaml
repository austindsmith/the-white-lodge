apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 1h
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: traefik
      version: 39.0.8
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    hostNetwork: true
    deployment:
      strategy:
        type: Recreate
    api:
      dashboard: true
    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
          - web
        matchRule: Host(`traefik.${cluster_domain}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
    service:
      type: ClusterIP
      ports:
        web:
          forwardedHeaders:
            trustedIPs:
              - 10.42.0.0/16
              - 10.43.0.0/16
        websecure:
          forwardedHeaders:
            trustedIPs:
              - 173.245.48.0/20
              - 103.21.244.0/22
              - 103.22.200.0/22
              - 103.31.4.0/22
              - 141.101.64.0/18
              - 108.162.192.0/18
              - 190.93.240.0/20
              - 188.114.96.0/20
              - 197.234.240.0/22
              - 198.41.128.0/17
              - 162.158.0.0/15
              - 104.16.0.0/13
              - 104.24.0.0/14
              - 172.64.0.0/13
              - 131.0.72.0/22
      providers:
        kubernetesCRD:
          allowExternalNameServices: true
