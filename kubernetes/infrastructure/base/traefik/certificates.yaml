apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: traefik
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - "${cluster_domain}"
    - "*.${cluster_domain}"
    - "${hidden_domain}"
    - "*.${hidden_domain}"
