apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: traefik
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - "cloud.${cluster_domain}"
    - "*.cloud.${cluster_domain}"
    - "cloud.${hidden_domain}"
    - "*.cloud.${hidden_domain}"
