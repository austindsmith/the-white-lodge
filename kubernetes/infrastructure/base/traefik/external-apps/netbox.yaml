apiVersion: v1
kind: Service
metadata:
  name: netbox
  namespace: netbox
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: netbox
  namespace: netbox
  labels:
    kubernetes.io/service-name: netbox
addressType: IPv4
ports:
  - name: https
    port: 443
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.50.5
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: netbox-selfsigned
  namespace: netbox
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netbox
  namespace: netbox
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`netbox.${cluster_domain}`)
      kind: Rule
      services:
        - name: netbox
          port: 443
          scheme: https
          serversTransport: netbox-selfsigned
