apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gh-proxy
  namespace: gh-proxy
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      gh-proxy:
        containers:
          app:
            image:
              repository: hunsh/gh-proxy-py
              tag: latest
    service:
      app:
        controller: gh-proxy
        ports:
          http:
            port: 80
