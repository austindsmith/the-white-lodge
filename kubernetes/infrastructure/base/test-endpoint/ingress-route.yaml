apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: test-ingress-route
  namespace: test-endpoint
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`test.cloud.${cluster_domain}`)
      kind: Rule
      services:
        - name: nginx-service
          port: 30081
  tls: {}
