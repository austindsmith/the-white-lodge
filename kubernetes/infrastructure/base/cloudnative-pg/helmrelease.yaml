apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-apps
spec:
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.28.3
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cnpg-apps
  values:
    crds:
      create: true
    webhook:
      mutating:
        failurePolicy: Fail
      validating:
        failurePolicy: Fail
    monitoring:
      enablePodMonitor: true
