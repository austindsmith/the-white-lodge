apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: apps-cluster-user-cert
  namespace: cnpg-apps
spec:
  updatePolicy: Replace
  deletionPolicy: Delete
  refreshInterval: 6h
  secretStoreRefs:
    - name: op-secret-store
      kind: ClusterSecretStore
  selector:
    secret:
      name: apps-cluster-user-cert
  data:
    - match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: apps-cluster-user-cert
          property: ca
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: apps-cluster-user-cert
          property: cert
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: apps-cluster-user-cert
          property: key
