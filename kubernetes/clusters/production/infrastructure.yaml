apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  dependsOn:
    - name: core
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  path: ./kubernetes/infrastructure/overlays/production
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  prune: true
  wait: true
