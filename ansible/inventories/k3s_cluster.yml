all:
  vars:
    ansible_env:
      OP_SERVICE_ACCOUNT_TOKEN: "{{ lookup('env', 'OP_SERVICE_ACCOUNT_TOKEN') }}"
  children:
    k3s_cluster:
      children:
        server:
          hosts:
            kubernetes-server-01:
        agent:
          hosts: {}
      vars:
        ansible_port: 22
        ansible_user: ansible
        k3s_version: v1.36.1+k3s1
        api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
        node_ip: "{{ lookup('community.general.onepassword', 'netcup', field='wg_ip_address', vault='the-white-lodge') }}"
        oidc_client_id: "{{ lookup('community.general.onepassword', 'headlamp', field='client_id', vault='the-white-lodge') }}"
        domain: "{{ lookup('community.general.onepassword', 'netcup', field='domain', vault='the-white-lodge') }}"
        extra_server_args: >-
          --node-ip="{{ node_ip }}" --flannel-iface=wg0 --disable=servicelb --disable=traefik --kube-apiserver-arg=oidc-issuer-url="https://authentik.{{ domain }}/application/o/headlamp/" --kube-apiserver-arg=oidc-client-id="{{ oidc_client_id }}" --kube-apiserver-arg=oidc-username-claim="email" --kube-apiserver-arg=oidc-groups-claim="groups" --kube-apiserver-arg=oidc-username-prefix="oidc:" --kube-apiserver-arg=oidc-groups-prefix="oidc:"
        cluster_context: the-white-lodge
