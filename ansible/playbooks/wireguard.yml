- name: Enroll netcup as WireGuard peer
  hosts: cloud
  become: true
  vars:
    ansible_host: "{{ wan_ip }}"
    wg_interface: wg0
    wg_config_path: "/etc/wireguard/{{ wg_interface }}.conf"
    wg_allowed_ips: "192.168.1.0/24, 192.168.2.0/24, 192.168.50.0/24"
    wg_persistent_keepalive: 25

  tasks:
    - name: Install wireguard-tools
      ansible.builtin.dnf:
        name: wireguard-tools
        state: present

    - name: Ensure wireguard directory exists
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Render wireguard interface configuration
      ansible.builtin.copy:
        dest: "{{ wg_config_path }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          [Interface]
          Address = {{ wg_interface_ip }}/32
          PrivateKey = {{ wg_private_key }}
          ListenPort = {{ wg_listen_port }}

          [Peer]
          PublicKey = {{ wg_server_pubkey }}
          Endpoint = {{ wg_server_endpoint }}
          AllowedIPs = {{ wg_allowed_ips }}
          PersistentKeepalive = {{ wg_persistent_keepalive }}
      notify: Restart wireguard

    - name: Gather service facts
      ansible.builtin.service_facts:


    - name: Enable and start wireguard interface
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        enabled: true
        state: started


  handlers:
    - name: Restart wireguard
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        state: restarted

    - name: Wait for WireGuard handshake
      ansible.builtin.command:
        cmd: "wg show {{ wg_interface }} latest-handshakes"
      register: wg_handshake
      changed_when: false
      retries: 30
      delay: 2
      until: >
        wg_handshake.stdout.split()[1] | int > 0
