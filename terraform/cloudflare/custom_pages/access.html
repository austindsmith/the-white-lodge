<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Log in | The Lodge</title>
        <style>
            /* Base styling and Dark Theme matching the SVG */
            body {
                margin: 0;
                padding: 0;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                background-color: #121212; /* Deep dark background */
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                color: #ebdbb2;
            }

            .login-container {
                text-align: center;
                width: 100%;
                max-width: 400px;
                padding: 20px;
            }

            .logo-container {
                margin-bottom: 32px;
                display: flex;
                justify-content: center;
            }

            .logo-container svg {
                width: 140px;
                height: 140px;
                /* Adds a subtle glow matching the orange accent */
                filter: drop-shadow(0 4px 12px rgba(214, 93, 14, 0.15));
            }

            .login-card {
                background-color: #1d2021; /* Matches the SVG background */
                border: 1px solid #3c3836;
                border-radius: 8px;
                padding: 32px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
                text-align: left;
            }

            .domain-text {
                font-size: 13px;
                color: #a89984;
                margin-bottom: 12px;
            }

            h1 {
                font-size: 24px;
                margin: 0 0 24px 0;
                font-weight: 600;
                color: #ebdbb2;
            }

            .form-group {
                margin-bottom: 20px;
            }

            label {
                display: block;
                font-size: 14px;
                margin-bottom: 8px;
                color: #ebdbb2;
            }

            input[type="email"] {
                width: 100%;
                padding: 12px;
                font-size: 14px;
                border: 1px solid #504945;
                border-radius: 4px;
                background-color: #282828;
                color: #ebdbb2;
                box-sizing: border-box;
                transition: all 0.2s ease-in-out;
            }

            input[type="email"]:focus {
                outline: none;
                border-color: #d65d0e;
                box-shadow: 0 0 0 2px rgba(214, 93, 14, 0.2);
            }

            input[type="email"]::placeholder {
                color: #7c6f64;
            }

            button {
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 4px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s ease-in-out;

                /* Themed orange button to match the SVG */
                background-color: #d65d0e;
                color: #1d2021;
            }

            button:hover {
                background-color: #fabd2f;
            }

            /* * NOTE: If you prefer the standard Cloudflare Blue button,
         * delete the button styles above and uncomment the ones below:
         *
         * button {
         * background-color: #0051c3;
         * color: white;
         * }
         * button:hover {
         * background-color: #003682;
         * }
         */
        </style>
    </head>
    <body>
        <div class="login-container">
            <div class="logo-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
                    <defs>
                        <linearGradient
                            id="grv-grad"
                            x1="0"
                            y1="0"
                            x2="1"
                            y2="1"
                        >
                            <stop offset="0%" stop-color="#d65d0e" />
                            <stop offset="50%" stop-color="#fabd2f" />
                            <stop offset="100%" stop-color="#689d6a" />
                        </linearGradient>
                        <clipPath id="card-clip">
                            <rect
                                x="2"
                                y="2"
                                width="316"
                                height="316"
                                rx="48"
                            />
                        </clipPath>
                    </defs>
                    <rect
                        x="2"
                        y="2"
                        width="316"
                        height="316"
                        rx="48"
                        fill="#1d2021"
                    />
                    <g clip-path="url(#card-clip)">
                        <polygon
                            points="160,66 106,162 214,162"
                            fill="#ebdbb2"
                        />
                        <polygon
                            points="132,56 72,162 192,162"
                            fill="#ebdbb2"
                        />
                        <line
                            x1="52"
                            y1="170"
                            x2="268"
                            y2="170"
                            stroke="#d65d0e"
                            stroke-width="1.25"
                        />
                        <polygon
                            points="160,264 106,172 214,172"
                            fill="#ebdbb2"
                            opacity="0.18"
                        />
                        <polygon
                            points="132,274 72,172 192,172"
                            fill="#ebdbb2"
                            opacity="0.18"
                        />
                        <text
                            x="160"
                            y="296"
                            font-family="'Josefin Sans','Century Gothic','Avenir',sans-serif"
                            font-size="11"
                            font-weight="300"
                            fill="#d65d0e"
                            letter-spacing="8"
                            text-anchor="middle"
                            opacity="0.85"
                        >
                            THE LODGE
                        </text>
                    </g>
                </svg>
            </div>

            <div class="login-card">
                <div class="domain-text">
                    theblacklodge.cloudflareaccess.com
                </div>
                <h1>Log in to *</h1>

                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            required
                        />
                    </div>
                    <button type="submit">Send login code</button>
                </form>
            </div>
        </div>
    </body>
</html>
